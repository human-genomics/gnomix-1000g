name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.9-slim-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates libgomp1

      - name: Python packages (pinned)
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Gnomix and Beagle (pinned, checksummed)
        run: bash setup_tools.sh tools

      - name: Unit tests
        env:
          GNOMIX1000G_TOOLS: tools
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x main.sh download.sh setup_tools.sh lib.sh validation/verify_pfile.sh

  image:
    needs: [test, shellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gnomix-1000g:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image loads the pinned stack and Gnomix
        run: |
          docker run --rm --entrypoint python3 gnomix-1000g:ci -c \
            "import sys; sys.path.insert(0, '/opt/tools/gnomix'); import xgboost, sklearn, pgenlib; \
             from src.model import Gnomix; from src.Gnofix.gnofix import gnofix; \
             assert xgboost.__version__ == '1.1.1' and sklearn.__version__ == '1.0.1'; print('ok')"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
